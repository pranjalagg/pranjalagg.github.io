    Projects:
      - name: Text Detection in Distorted Social Media Images Using Genetic Programming
        start_date: 2022-01-01
        end_date: 2022-08-01
        highlights:
          - Developed a model to detect text in natural images distorted by continuous sharing on social media
          - Used MSER to fetch connected components and developed a 3x3 filter using genetic programming
          - Classified the components as text and non-text and used the text components with iterative dilation to create bounding boxes around the text

      - name: Android Malware Classification
        start_date: 2021-08-01
        end_date: 2021-12-01
        highlights:
          - Implemented sampling techniques to address the issue of working with large datasets
          - Implemented Principal Component Analysis (PCA) for exploratory data analysis and to reduce the dimension since the dataset had a large number of columns (9503)
          - Trained Artificial Neural Networks (ANN) to achieve an accuracy of 67%

      - name: Hope Speech Detection on Social Media Platforms
        start_date: 2021-01-01
        end_date: 2021-05-01
        highlights:
          - Trained a Natural Language Processing (NLP) based system to classify text comments as Hope, Non-Hope speech
          - Implemented techniques such as Bag of Words, TF-IDF, Word2Vec for text vectorization
          - Used data balancing techniques (SMOTE, ADASYN, etc.)
          - Introduced a third label (Neutral Speech) for better classification
          - Analyzed and experimented on both the datasets (old and new) with conventional ML models, LSTMs, and adopted BERT architecture
          - Published as a book chapter in Cyber Crime in Social Media (CCSM), August 2022

      - name: Random Decision Forest Approach for Mitigating SQL Injection Attacks
        start_date: 2020-05-01
        end_date: 2020-08-01
        highlights:
          - Trained a classifier to identify and mitigate SQL injection attacks
          - Collected data (malicious queries) and identified features to streamline the data for better insights
          - Scored a list of keywords according to their risk factors getting an accuracy of about 95%

